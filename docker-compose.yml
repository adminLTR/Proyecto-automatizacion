version: '3.8'

services:
  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram-automation-bot
    ports:
      - "5000:5000"
    environment:
      # These will be overridden by .env file
      - FLASK_ENV=${FLASK_ENV:-production}
      - FLASK_DEBUG=${FLASK_DEBUG:-False}
      - APP_HOST=0.0.0.0
      - APP_PORT=5000
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_BASE_URL=${TELEGRAM_BASE_URL:-https://api.telegram.org/bot}
      - SECRET_KEY=${SECRET_KEY}
      - DEFAULT_EMAIL_RECIPIENT=${DEFAULT_EMAIL_RECIPIENT}
      - EMAIL_DELETE_DAYS_AGO=${EMAIL_DELETE_DAYS_AGO:-7}
      - CALENDAR_TIMEZONE=${CALENDAR_TIMEZONE:-America/Lima}
      - GOOGLE_CREDENTIALS_PATH=/app/credentials.json
      - GOOGLE_TOKEN_PATH=/app/token.json
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - USE_WEBHOOK=${USE_WEBHOOK:-False}
      - WEBHOOK_URL=${WEBHOOK_URL}
    volumes:
      # Mount credentials file
      - ./credentials.json:/app/credentials.json:ro
      # Persist token file
      - ./token.json:/app/token.json
      # Optional: Mount logs directory
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - bot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  bot-network:
    driver: bridge

volumes:
  bot-data:
